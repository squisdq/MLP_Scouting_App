<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FTC Scout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ["Barlow", "system-ui", "sans-serif"], score: ["'Barlow Condensed'", "Barlow", "sans-serif"] },
        colors: { ink: "#0f172a", field: "#1d4ed8", tape: "#f59e0b" },
      } },
    };
  </script>
  <style type="text/tailwindcss">
    body { @apply bg-slate-100 font-sans text-ink antialiased; }
    .field-label { @apply mb-1 block text-sm font-medium text-slate-600; }
    .field-input { @apply w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-base focus:border-field focus:outline-none focus:ring-2 focus:ring-field/30; }
  </style>
</head>
<body>
  <div id="root"><p style="padding:2rem;font-family:sans-serif">Загрузка…</p></div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
